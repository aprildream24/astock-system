# 模拟盘调度：16 个时点（now 09:25 / scan×12 密集巡逻 / 尾盘确认 14:43 / 复盘 15:32）
name: executor

on:
  schedule:
    - cron: "25 1 * * 1-5"   # 09:25 now
    - cron: "35 1 * * 1-5"   # 09:35 scan
    - cron: "50 1 * * 1-5"   # 09:50 scan
    - cron: "5 2 * * 1-5"    # 10:05 scan
    - cron: "20 2 * * 1-5"   # 10:20 scan
    - cron: "35 2 * * 1-5"   # 10:35 scan
    - cron: "50 2 * * 1-5"   # 10:50 scan
    - cron: "5 3 * * 1-5"    # 11:05 scan
    - cron: "20 3 * * 1-5"   # 11:20 scan
    - cron: "5 5 * * 1-5"    # 13:05 scan
    - cron: "20 5 * * 1-5"   # 13:20 scan
    - cron: "35 5 * * 1-5"   # 13:35 scan
    - cron: "50 5 * * 1-5"   # 13:50 scan
    - cron: "5 6 * * 1-5"    # 14:05 scan
    - cron: "43 6 * * 1-5"   # 14:43 尾盘确认
    - cron: "32 7 * * 1-5"   # 15:32 复盘
  workflow_dispatch:
    inputs:
      task:
        description: "executor 任务: now | scan | tail | review"
        default: scan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 模拟盘巡逻+推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          TASK="${{ github.event.inputs.task || 'scan' }}"
          case "$GITHUB_SCHEDULE" in
            "25 1 * * 1-5") TASK=now ;;
            "43 6 * * 1-5") TASK=tail ;;
            "32 7 * * 1-5") TASK=review ;;
            *)              TASK=scan ;;
          esac
          python -m tools.executor --task "$TASK"

  watchdog:
    # 调度守护（吸收原项目 watchdog）：收盘后检查今日任务是否缺跑
    needs: run
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 缺跑检测
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python tools/watchdog.py
