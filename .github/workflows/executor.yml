# 模拟盘调度：16 个时点（now 09:25 / scan×12 密集巡逻 / 尾盘确认 14:43 / 复盘 15:32）
name: executor

on:
  schedule:
    - cron: "25 1 * * 1-5"   # 09:25 now
    - cron: "35 1 * * 1-5"   # 09:35 scan
    - cron: "50 1 * * 1-5"   # 09:50 scan
    - cron: "5 2 * * 1-5"    # 10:05 scan
    - cron: "20 2 * * 1-5"   # 10:20 scan
    - cron: "35 2 * * 1-5"   # 10:35 scan
    - cron: "50 2 * * 1-5"   # 10:50 scan
    - cron: "5 3 * * 1-5"    # 11:05 scan
    - cron: "20 3 * * 1-5"   # 11:20 scan
    - cron: "5 5 * * 1-5"    # 13:05 scan
    - cron: "20 5 * * 1-5"   # 13:20 scan
    - cron: "35 5 * * 1-5"   # 13:35 scan
    - cron: "50 5 * * 1-5"   # 13:50 scan
    - cron: "5 6 * * 1-5"    # 14:05 scan
    - cron: "43 6 * * 1-5"  # 14:43 尾盘确认
    - cron: "32 7 * * 1-5"  # 15:32 复盘
  workflow_dispatch:
    inputs:
      task:
        description: "executor 任务: now | scan | tail | review"
        default: scan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 模拟盘巡逻+推送
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 修复：Actions 无 GITHUB_SCHEDULE 变量（同 stock.yml 的坑：恒空 → 全落 scan）
          GH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            case "$GH_SCHEDULE" in
              "25 1 * * 1-5") TASK=now ;;
              "43 6 * * 1-5") TASK=tail ;;
              "32 7 * * 1-5") TASK=review ;;
              *)              TASK=scan ;;
            esac
          fi
          echo "[executor] GH_SCHEDULE='$GH_SCHEDULE' -> TASK=$TASK"
          python -m tools.executor --task "$TASK"

  # watchdog job 已删（2026-09-14）：它检查的 fetch_stats.json / push_ledger
  # 属于主链（stock workflow）的 cache 目录，两个 workflow 的 runner 不共享，
  # 在 executor 上跑永远"fetch_daily 从未跑过 / build 未跑"→ 16 时点/天全是
  # 误报告警（用户当日实际收到的骚扰消息即此），且把每次 run 拖成 failure。
  # 本地调度守护保留在 tools/watchdog.py + install_schedule.bat 的 16:00/21:00。
