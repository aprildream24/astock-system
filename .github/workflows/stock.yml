# 主链调度 + GitHub Pages 自动发布（唯一部署通道）
# 时点为北京时间（UTC+8）；密钥只从仓库 Secrets 注入，源码零密钥。
# Secrets 一览：
#   WXPUSHER_CONF   WxPusher 账户 JSON 数组（多账户）：
#                   [{"name":"主号","app_token":"AT_xxx","uids":["UID_xxx"]}]
#   SITE_USERS      站点口令 JSON（2026-09-15 起支持分角色形态）：
#                   新形态（推荐）：
#                     {"users":[{"id":"owner","name":"本人","pass":"...",
#                                "roles":["all"]},
#                               {"id":"zhang","name":"张三","pass":"...",
#                                "roles":["watch","buy"]}]}
#                   旧形态（仍兼容）：{"owner":"口令","guest":"口令"}
#                   roles: all=全部 / watch=自选 / observe=观察池 / buy=持仓购入
#                   —— 未授权分组在**密文层**被剥离，非前端隐藏。
#   SERVERCHAN_KEY  可选备用通道
#   PUSHPLUS_TOKEN  可选备用通道
#   GLM_API_KEY     可选：智谱开放平台 key（免费模型 glm-4.7-flash，AI 叙事用）
#   GLM_MODEL       可选：覆盖智谱模型名，默认 glm-4.7-flash（免费档）
# 未配置推送 key 时系统自动 dry-run，流水线不会失败。
name: stock

on:
  # 2026-09-14 晚起 GitHub 自带 schedule cron 全部删除——它延迟 1-2h 且不可控，
  # 当晚 20:02 复盘 cron 拖到 22:10 才跑，造成 build_close 重复推送。
  # 权威触发 = cron-job.org（astock-pre/auction/close/review，走 dispatches API
  # 带 task inputs，与本 workflow_dispatch 完全兼容）。
  workflow_dispatch:
    inputs:
      task:
        description: "build 任务: pre | auction | close | review | site | intraday | rehearsal | watch-sync | timer-live"
        default: close
      slot:
        description: "intraday 专用: am=早盘校验(09:45) | pm=尾盘机会(14:40) | live=买点巡检(每10分钟·事件级去重)"
        default: ""
      codes:
        description: "watch-sync 专用：自选代码，逗号分隔（如 sh600519,sz000001）"
        default: ""
      holdings:
        description: "holdings-sync 专用：持仓 JSON（代码/买价/股数），手机端页面提交"
        default: ""
      # 2026-09-16 新增：手工补发开关。填 1 时 build 会
      # ① 绕过当日去重保险丝（否则 auction/close 当天已 sent 会被拦住）
      # ② 给推送标题打【补发】前缀（用户能区分补发与正常触发）
      # 日常定时触发不传该参数 ⇒ 恒为空 ⇒ 与改动前行为完全一致。
      force:
        description: "补发模式：填 1 = 绕过当日去重强制重发（仅手工补发用）"
        default: ""
      period_days:
        description: "周期复盘窗口（天）：用户需求①，半月=15 / 月度=30"
        default: "30"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 2026-09-15：45 → 75 分钟。冷库/长假期后首次全量 4993 只实测 ≈53 分钟，
    # 45 分钟会在最后关头被 cancel 且连带推送步骤 skipped。给足余量。
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 行情库持久化：runner 无状态，每次冷库全量重拉必超时。
      # cache/（market.db + fetch_stats.json）跨 run 复用，命中后增量秒级。
      #
      # ⚠️ 2026-09-16 修（账本被抹血案）：
      # ① `dist/push_ledger.json` **移出** cache 的 path。它同时被
      #    actions/checkout 从仓库 checkout 到工作区，两个来源会打架；
      #    而 checkout 先跑、cache 后跑，实际以 checkout 的**陈旧快照**为准
      #    → CI 跑完只剩几条 → push_ledger_sync PUT 上去把远端历史整片抹掉
      #    （实测本地 14 条 vs 远端 3 条）。账本改用「GET 远端 → 合并 → PUT」
      #    单向收敛，不再借道 cache。
      # ② key 里原本含 run_id（每 run 新 key）→ 每次都写一份新缓存，
      #    实测累积 15 份 ≈ 469 MB，逼近 10 GB 免费额度。改为按内容不变
      #    的原则：用 restore-keys 前缀恢复，key 固定复用（内容变化由
      #    post 步骤以同一 key 覆盖写，不新增条目）。
      - uses: actions/cache/restore@v4
        id: cache-db
        with:
          path: cache
          # ⚠️ 2026-09-16 二次修（血案：CI run 35002284192 冷库全量重拉）：
          # 固定 key `market-db-v2` + `cache/save@v4` 是**死锁组合**——
          # save 不允许覆盖已存在的 key，所以**第一次**存进去的那份就永久
          # 生效，之后再也不会更新（实测首次存的是 0 字节空缓存，于是每个
          # run 都「库最新 空」→ 4937 只全量重拉 ~17 分钟）。
          # 正解：**key 带 run_id（每次都能存新的）+ restore-keys 前缀回退
          # （总能捞到最近一份）**，再配合「只保留最新 1 份」的清理步骤，
          # 既持续更新又不膨胀。
          key: market-db-${{ github.run_id }}
          restore-keys: |
            market-db-
      - name: 安装测试/运行时依赖
        if: github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync'
        # 2026-09-15 修（血案根因）：runner 预装列表里没有 PyNaCl / PyYAML。
        # 缺它们会让回归自检 ERROR/低 PASS → 触发「回归倒退」exit 2 →
        # 后面 7 个步骤全 skipped → 全天零推送（实测 run 34985391295）。
        # 一次装齐，让 CI 与本地跑同一套断言。
        run: python -m pip install --quiet pynacl pyyaml
      - name: 回归自检
        if: github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync'
        env:
          # 2026-09-15：回归用例会断言「CI 上至少有一种推送凭据」——
          # 不注入这些 Secret，该断言在 CI 上必然 FAIL（实测 run 34987206020）。
          # 这也顺带验证了 Secrets 真的配置到位。
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WXPUSHER_CONF: ${{ secrets.WXPUSHER_CONF }}
        run: python tests/run_regression.py
      # ---- 网页自助加自选（2026-09-15）------------------------------------
      # owner 在站点上点「加入/删除」→ 前端发 workflow_dispatch(task=watch-sync,
      # codes="sh600519,...") → 本步用 Python PyNaCl 写 Secret WATCH_CODES。
      # 浏览器端零加密依赖（v1 的 libsodium 客户端加密已废弃）。
      - name: 同步自选到 Secret（watch-sync）
        if: github.event.inputs.task == 'watch-sync'
        env:
          # 写 Secrets 必须 PAT（GITHUB_TOKEN 无 actions:secrets 写权限）
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          WATCH_CODES_IN: ${{ github.event.inputs.codes }}
        run: |
          python -m pip install --quiet pynacl
          python -m pipeline.sync_watch
      # ---- 手机端持仓管理（用户需求④：不在对话框里加减，网页表单提交）----
      # owner 在手机网页填好持仓（代码/买价/股数）→ 页面发
      # workflow_dispatch(task=holdings-sync, holdings="<JSON>") → 本步用
      # PyNaCl 写 Secret HOLDINGS_CONF；load_holdings 已支持从 Secret 读取，
      # 云端自动生效。浏览器只发一个带文本的 HTTPS 请求，无需任何加密库/后端。
      - name: 同步持仓到 Secret（holdings-sync）
        if: github.event.inputs.task == 'holdings-sync'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          HOLDINGS_IN: ${{ github.event.inputs.holdings }}
        run: |
          python -m pip install --quiet pynacl
          python -m pipeline.sync_holdings
      - name: 收盘数据抓取（全市场）
        # ⚠️ 2026-09-16：`site` **移出**本条件（原含 task == 'site'）。
        # 站点是纯展示层，数据新鲜度由 15:22 的 close 负责（close 之后
        # 必然重建站点），site 自己再拉一次全市场纯属白烧 ~6 分钟——
        # 而 site 正是「验证 CI 新代码」最常用的入口（task=site 跑回归
        # 自检但不发推送、不占额度），每次多等 6 分钟代价太大。
        # 冷库时 site 会读到 restore-keys 恢复的行情库，不会二次冷启。
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          ((github.event_name == 'schedule' &&
            github.event.schedule == '22 7 * * 1-5') ||
           (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.task == 'close' ||
             github.event.inputs.task == '')))
        # 2026-09-15 修复：抓取失败不得连坐推送。原 fail-fast 让第 8 步
        # 「构建+推送」整步 skipped ⇒ 用户全天零推送（8:50 failure / 9:25
        # cancel 实证）。改为 continue-on-error，抓取失败时 build 仍会用
        # 库中已有数据构建并推送（数据陈旧会在推送里显式标注）。
        continue-on-error: true
        run: python -m pipeline.fetch_daily
      - name: 盘前/竞价轻量增量抓取
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          ((github.event_name == 'schedule' &&
            (github.event.schedule == '50 0 * * 1-5' ||
             github.event.schedule == '25 1 * * 1-5' ||
             github.event.schedule == '5 0 * * 1')) ||
           (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.task == 'pre' ||
             github.event.inputs.task == 'auction' ||
             github.event.inputs.task == 'review')))
        continue-on-error: true
        # 2026-09-16 修（血案 run 34914806060）：盘前 08:50 快照 pct 天然全 0
        # （集合竞价未开始）→ 旧逻辑判「疑似休市日」抛异常 → 抓取 failure
        # → 构建+推送整步 skipped → 用户全天收不到盘前推送。
        # --premarket 明确告知这是盘前时段，全 0 属正常。
        # review 是盘后（20:02）跑，不属盘前，故不加该标志。
        #
        # ⚠️ 2026-09-16 二次血案：**Actions 表达式不支持三元**！
        # 原写法用 JS 风格的三元表达式做条件展开，导致 workflow 整个
        # **解析失败** → dispatch 返 422、run 零 job（零日志）。改用 bash
        # 条件展开（`case` 判断 task，仅 pre/auction 追加标志）——纯 shell。
        #   "failed to parse workflow: Unexpected symbol: '?'"
        # 正是这个 YAML 让当晚所有定时触发都无法启动。改用 bash 条件展开
        #（`case` 判断 task，仅 pre/auction 追加标志）——纯 shell，表达式简单。
        run: |
          EXTRA=""
          case "${{ github.event.inputs.task }}" in
            pre|auction) EXTRA="--premarket" ;;
          esac
          echo "task=${{ github.event.inputs.task }} extra=$EXTRA"
          python -m pipeline.fetch_daily --days 20 $EXTRA
      - name: 构建+推送（WxPusher/PushPlus 多渠道）
        if: github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync'
        env:
          WXPUSHER_CONF: ${{ secrets.WXPUSHER_CONF }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WATCH_CODES: ${{ secrets.WATCH_CODES }}
          HOLDINGS_CONF: ${{ secrets.HOLDINGS_CONF }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          # 修复：Actions 无 GITHUB_SCHEDULE 变量（原写法恒为空 → 任务永远落到 close）
          GH_SCHEDULE: ${{ github.event.schedule }}
          # 补发开关（workflow_dispatch 的 force 参数，默认空 ⇒ 行为不变）
          ASTOCK_FORCE_PUSH: ${{ github.event.inputs.force }}
          ASTOCK_BACKFILL: ${{ github.event.inputs.force }}
          ASTOCK_PERIOD_DAYS: ${{ github.event.inputs.period_days }}
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then
            case "$GH_SCHEDULE" in
              "50 0 * * 1-5") TASK=pre ;;      # 08:50 盘前计划
              "25 1 * * 1-5") TASK=auction ;;  # 09:25 竞价裁决
              "22 7 * * 1-5") TASK=close ;;    # 15:22 收盘构建
              "5 0 * * 1")    TASK=pre ;;      # 周一 08:05 预热
              # 09:26 开盘异动 / 10:07 / 14:07 盘中异动：build.py 暂无 anomaly 任务，
              # 以前会被 * 兜底成 close 造成重复收盘推送，明确跳过。
              "26 1 * * 1-5") TASK=skip ;;
              "7 2 * * 1-5")  TASK=skip ;;
              "7 6 * * 1-5")  TASK=skip ;;
              # 20:02 复盘 / 20:03 周日发酵：由下方「收盘复盘」步骤负责，此处不重复
              "2 12 * * 1-5") TASK=skip ;;
              "3 12 * * 0")   TASK=skip ;;
              *)              TASK=close ;;
            esac
          fi
          echo "[schedule] GH_SCHEDULE='$GH_SCHEDULE' -> TASK=$TASK"
          if [ "$TASK" = "skip" ]; then
            echo "[schedule] 该时点无对应任务，跳过构建与推送"
            exit 0
          fi
          if [ "$TASK" = "site" ]; then
            # site 任务只做站点构建+Pages 部署（由下方「构建加密站点」步骤负责，
            # 它才会从 SITE_USERS 写入 config/users.json）——本步骤若执行
            # build --task site 会因 users.json 未写入而失败（2026-09-14 修复）
            echo "[site] 站点任务不在本步骤推送"
            exit 0
          fi
          if [ "$TASK" = "timer-live" ]; then
            # 一次性安装（2026-09-26）：在 cron-job.org 上克隆
            # astock-intraday-am 新建 astock-intraday-live（每 10 分钟触发
            # 盘中买点巡检，事件级去重推送）。幂等：已存在则核对修正。
            # 只动 astock-* 前缀；旧系统 stock-*/exec-* 一律不碰。
            env CRONJOB_API_KEY="${{ secrets.CRONJOB_API_KEY }}"                 python tools/timer_live.py
            exit 0
          fi
          if [ "$TASK" = "cron-cleanup" ]; then
            # 一次性清理（2026-09-25）：删除旧系统（另一账户）遗留在
            # cron-job.org 的 15 个 stock-*/exec-* 定时器——它们仍在向
            # 用户微信推旧版式消息，是「收到的还是老板式」的真凶。
            env CRONJOB_API_KEY="${{ secrets.CRONJOB_API_KEY }}"                 python tools/cron_cleanup.py
            exit 0
          fi
          if [ "$TASK" = "rehearsal" ]; then
            # 云端全链路演练（2026-09-19 用户：「全部在网络上运行一次，
            # 该推送的信息全部推送一遍」）。锚定最近交易日用真实数据，
            # notifier/build 走 ASTOCK_REHEARSAL 独立通道：
            #   · mode 加 rehearsal_ 前缀 → 与正式推送的日熔丝完全隔离，
            #     不影响周一；
            #   · 标题加【演练】；
            #   · force=1 便于反复演练（每次都真发）。
            # 链式跑四种版式：盘前 → 竞价 → 收盘 → 晚间综合。
            export ASTOCK_REHEARSAL=1
            export ASTOCK_FORCE_PUSH=1
            echo "[rehearsal] 全链路演练开始（锚定最近交易日）"
            python -m pipeline.build --task pre
            python -m pipeline.build --task auction
            python -m pipeline.build --task close
            python -m pipeline.build --task review
            echo "[rehearsal] 模拟盘演练（时段闸门/打扰纪律自动裁决）"
            python -m tools.executor --task auto --slot am
            python tools/exec_sample.py
            echo "[rehearsal] 全版式推送完成"
            exit 0
          fi
          if [ "$TASK" = "intraday" ]; then
            # M41 盘中计划校验：**不抓日K**（下面两个抓取步骤的 if 都不含
            # intraday，天然跳过），由模块内部只拉实时快照并写独立表
            # snapshot_live —— 盘中价绝不能进 klines/snapshot 主表。
            # ⚠️ 用 shell 分支而非 Actions 三元表达式。历史血案：三元语法会让
            # 整个 workflow 解析失败 → dispatch 422、run 零 job。
            # ⚠️ 二次血案（2026-09-16）：**run 块标量里的 `#` 只是 shell 注释，
            # 但 GitHub 的表达式扫描器照样解析其中的花括号表达式** —— 本注释
            # 曾在块内写出三元的字面形式而让 workflow 直接解析失败。
            # 纪律：任何位置（含 run 块内注释）都不得出现三元表达式字面量。
            SLOT="${{ github.event.inputs.slot }}"
            if [ -z "$SLOT" ]; then SLOT=pm; fi
            echo "[intraday] slot=$SLOT"
            python -m pipeline.build --task intraday --slot "$SLOT"
            exit 0
          fi
          if [ "$TASK" = "period" ]; then
            # 用户需求①：半月/月度周期复盘（盈利最大化 + 系统改进建议）。
            # 独立于选股主链，不依赖当日数据就绪；窗口由 period_days 决定
            # （调度器在每月 1 日传 30、16 日传 15）。只发一条【周期】推送，
            # 随后跳过站点重建（周期报告不改站点数据）。
            PDAYS="${{ github.event.inputs.period_days }}"
            if [ -z "$PDAYS" ]; then PDAYS=30; fi
            echo "[period] days=$PDAYS"
            python -m pipeline.build --task period --period-days "$PDAYS"
            exit 0
          fi
          python -m pipeline.build --task "$TASK"
      # ★ 2026-09-18 新增：模拟盘自动运行（用户："是不是还有模拟盘没运行？
      # 请全面修复，按照 100000 元起步开始自动运行"）。
      # 诊断结论（两条根因，均已实锤）：
      #   ① **功能缺失**：pipeline/executor.py 只有"退出裁决"、没有任何买入
      #      路径 ⇒ 账户永远空仓 ⇒ 巡逻无对象 ⇒ 日志为空 ⇒ 一条推送都不发；
      #   ② **通道缺失**：executor.yml 既没挂定时器、又**没有 cache 恢复**
      #      ⇒ runner 上是全新空库 ⇒ 无 K 线无持仓，即便被触发也无事可做。
      # 修法：把模拟盘挂在 **close 主链之后**（而不是另开一个 workflow）——
      #   · 复用同一份行情库缓存（executor 单跑时必然拿到空库）；
      #   · 模拟盘状态与行情库同处 cache/，随本 workflow 的 save 一起持久化，
      #     不会出现"两个 workflow 各存一份、缓存 GC 删掉另一份"的状态回退；
      #   · 不需要在 cron-job.org 增加定时器（少一个会失效的环节）。
      # ── 2026-09-18 二次修（用户："需要考虑周末和节假日，今天已经不在交易
      #    时间了又开始购买"）────────────────────────────────────────────
      #   **建仓的时段闸门在代码里**（executor.session_gate：周末/法定节假日、
      #   开盘前、午休、收盘后一律不下单），本步骤只是"喂数据"：
      #     · close(15:22)/pre(08:50) 都不在撮合时段 ⇒ 只巡逻+风控，不建仓；
      #     · 真正会建仓的是 auction(09:25) 与 intraday(09:45/14:40) ——
      #       故这里必须把 auction / intraday 也纳入（否则永远没有可下单时刻）；
      #     · intraday 传 --slot am|pm ⇒ 取 snapshot_live 的**当下价**，
      #       而不是盘前快照价（否则拿 09:25 的价去当 14:40 的价成交）。
      #   continue-on-error：模拟盘是旁路，任何异常都不允许影响主链推送。
      - name: 模拟盘自动运行（建仓+巡逻）
        if: >-
          github.event.inputs.task == '' ||
          github.event.inputs.task == 'close' ||
          github.event.inputs.task == 'auction' ||
          github.event.inputs.task == 'intraday'
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WXPUSHER_CONF: ${{ secrets.WXPUSHER_CONF }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          echo "[executor] slot=$SLOT（空=非盘中任务；建仓时段闸门在 executor 内部）"
          python -m tools.executor --task auto --slot "$SLOT"
      # ★ 2026-09-26 新增：盘中买点巡检长循环（auction 顺链）。
      # cron-job.org 的 astock-intraday-live 定时器因 Secret key 无效
      # （GET /jobs 404）暂建不出，由本步骤在每个交易日竞价后 dispatch
      # intraday-live.yml——单 runner 常驻交易时段，每 10 分钟一轮
      # 买点巡检（事件级去重）+ 模拟盘同步建仓。用户补有效 key 并建成
      # 定时器后，删除本步骤即可（两条触发路径并存也不会重复推送）。
      - name: 触发盘中买点巡检长循环（auction 顺链）
        if: github.event.inputs.task == 'auction'
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          ST=$(curl -s -o /tmp/disp_live.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/intraday-live.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "[live-loop] dispatch=$ST（204=成功；非 204 时下一交易日无高频巡检）"
      - name: 收盘复盘（自选股建议+AI叙事）
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          ((github.event_name == 'schedule' &&
            github.event.schedule == '2 12 * * 1-5') ||
           (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.task == 'review'))
        env:
          WXPUSHER_CONF: ${{ secrets.WXPUSHER_CONF }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WATCH_CODES: ${{ secrets.WATCH_CODES }}
          HOLDINGS_CONF: ${{ secrets.HOLDINGS_CONF }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          ASTOCK_FORCE_PUSH: ${{ github.event.inputs.force }}
          ASTOCK_BACKFILL: ${{ github.event.inputs.force }}
        run: python -m pipeline.build --task review
      - name: 构建加密站点
        # intraday（盘中校验）/ period（周期复盘）/ timer-live（装定时器）
        # 不改任何站点数据 → 跳过重建
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          github.event.inputs.task != 'intraday' &&
          github.event.inputs.task != 'period' &&
          github.event.inputs.task != 'timer-live'
        env:
          SITE_USERS: ${{ secrets.SITE_USERS }}
          SITE_EDIT_TOKEN: ${{ secrets.SITE_EDIT_TOKEN }}
        run: |
          mkdir -p config
          echo "$SITE_USERS" > config/users.json
          python -m pipeline.build --task site
      # 2026-09-15：把推送账本提交回仓库。tools/daily_check.py 靠
      # /contents/dist/push_ledger.json 判定「今天到底有没有真发出推送」；
      # 不提交它，体检的远端账本永远 404 → 永远误报「零推送」。
      # 只提交这一个文件，自选/持仓等隐私文件都在 .gitignore 里。
      - name: 回写推送账本（供体检读取）
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          (success() || failure())
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python -m pipeline.push_ledger_sync
      # 2026-09-16 新增：跑完即自检 —— 读**远端**账本确认本次任务的推送
      # **真的送达了**（不是"步骤没报错"）。
      # 血案：09-16 08:50 那轮每一步 conclusion 都是 success，但 build_pre
      # 账本状态是 uncertain、用户端零消息 —— 「步骤绿 ≠ 送达」。
      # 判据：本任务期望 mode 今天有 status=sent 的记录；缺失但已发
      # data_blocked_* / data_holiday 显式告警 → WARN（已主动告知，非静默失败）。
      # 只报告、不回补（同一 run 里再触发自己只会白烧额度）；补发交 watchdog。
      # ⚠️ continue-on-error：本步骤是"体检"，任何自身异常都不允许影响主链
      #（新增步骤连坐推送是这个项目最贵的一类事故）。
      - name: 推送验收（自检）
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          github.event.inputs.task != 'timer-live' &&
          (success() || failure())
        continue-on-error: true

        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          TASK="${{ github.event.inputs.task }}"
          if [ -z "$TASK" ]; then TASK=close; fi
          python -m pipeline.push_audit --task "$TASK"
      - name: 上传 Pages 构件
        if: >-
          github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
          github.event.inputs.task != 'intraday' &&
          github.event.inputs.task != 'period' &&
          github.event.inputs.task != 'timer-live'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # key 带 run_id 才能持续更新（save 不覆盖已存在的 key）；膨胀由下面的
      # 「清理旧行情库缓存」步骤兜住——只保留最新 1 份。
      # always() 保证抓取失败时也存库，避免整轮白拉。
      - name: 保存行情库缓存
        if: always() && github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: market-db-${{ github.run_id }}
      # 清理旧缓存：GitHub 缓存有 10 GB 仓库上限，不清理会持续膨胀
      # （实测旧策略累积 15 份 ≈ 469 MB，且每份都是整个 market.db）。
      # 只删 market-db- 前缀且**不是本次 run** 的条目 → 长期稳定在 1 份。
      - name: 清理旧行情库缓存
        if: always() && github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync'
        continue-on-error: true      # 清理失败不得影响主链
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python -m pipeline.cache_gc

  deploy-pages:
    needs: build
    if: >-
      github.event.inputs.task != 'watch-sync' && github.event.inputs.task != 'holdings-sync' &&
      ((github.event_name == 'schedule' &&
        github.event.schedule == '22 7 * * 1-5') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.task == 'site' ||
         github.event.inputs.task == 'close' ||
         github.event.inputs.task == '')))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
