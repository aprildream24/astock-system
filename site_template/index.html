<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astra 收盘观察</title>
<style>
  :root{
    --bg:#111418;--card:#1b2027;--card2:#222832;--line:#2c3440;
    --tx:#e8eaf0;--tx2:#8b95a5;--buy:#ff6b6b;--sell:#3ddc84;--hold:#5b8def;
    --warn:#e6a700;--red:#ff5252;--acc:#5b8def;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);
       color:var(--tx);padding:14px;max-width:720px;margin:0 auto;font-size:15px;line-height:1.55}
  a{color:var(--acc)}
  .gate{max-width:400px;margin:18vh auto;text-align:center}
  .gate h1{font-size:22px;margin-bottom:6px}
  .gate p.sub{color:var(--tx2);font-size:13px;margin-bottom:18px}
  input{padding:11px 12px;border-radius:8px;border:1px solid var(--line);
        background:#151a20;color:var(--tx);width:100%;font-size:15px}
  button{padding:10px 18px;border-radius:8px;border:0;background:var(--acc);
         color:#fff;cursor:pointer;font-size:15px;font-weight:600}
  .gate .row{display:flex;gap:8px;margin-top:10px}
  .gate .row input{flex:1}
  #err{color:var(--buy);font-size:13px;margin-top:10px;min-height:18px}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  header h1{font-size:18px}
  header .date{color:var(--tx2);font-size:13px}
  nav{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto}
  nav button{background:var(--card);color:var(--tx2);padding:7px 14px;font-size:13px;font-weight:500}
  nav button.on{background:var(--acc);color:#fff}
  .card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
  .card h3{font-size:14px;color:var(--tx2);font-weight:600;margin-bottom:8px;
           text-transform:letter-spacing:.5px}
  .badge{display:inline-block;padding:2px 9px;border-radius:5px;color:#fff;
         font-weight:700;font-size:13px;white-space:nowrap}
  .b-green{background:#1d7a4c}.b-yellow{background:#b9860b}.b-red{background:#c62828}
  .b-grey{background:#4a5568}.b-blue{background:#2c5cc5}
  .up{color:var(--buy)}.down{color:var(--sell)}
  .muted{color:var(--tx2)}.small{font-size:12.5px}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;color:var(--tx2);font-size:12.5px;margin-top:8px}
  .zone{font-variant-numeric:tabular-nums}
  /* 情绪仪表 */
  .emo{display:flex;gap:16px;align-items:center}
  .emo .info{flex:1}
  .emo .score{font-size:34px;font-weight:800;line-height:1.1}
  .emo .lbl{font-size:14px;color:var(--tx2)}
  .dimgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px}
  .dim{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2)}
  .dim .ok{color:var(--tx)}
  .dim .miss{color:#6b4b00}
  /* 卡片 */
  .stock-card{background:var(--card2);border-radius:10px;padding:12px;margin:8px 0}
  .stock-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .stock-card .name{font-size:16px;font-weight:700}
  .stock-card .code{color:var(--tx2);font-weight:400;font-size:13px;margin-left:6px}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:2px 0}
  .kv .k{color:var(--tx2)}
  .reason{font-size:13px;color:var(--tx2);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
  .score-tag{font-size:11px;color:var(--tx2)}
  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--tx2);text-align:left;font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
  td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  /* SVG */
  .chart{width:100%;height:150px}
  /* 横幅 */
  .banner{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px;font-weight:600}
  .banner.red{background:#3a1416;border:1px solid #7a2226;color:#ff8a8a}
  .banner.yellow{background:#332a10;border:1px solid #6e5a1a;color:#e8c96a}
  .banner.blue{background:#14202f;border:1px solid #24406a;color:#9db8e8}
  .footer{color:var(--tx2);font-size:12px;margin:18px 0 8px;line-height:1.6}
  .empty{color:var(--tx2);text-align:center;padding:22px 0;font-size:13.5px}
  .tag{display:inline-block;background:#2a3340;border-radius:4px;padding:1px 7px;
       font-size:11.5px;color:var(--tx2);margin-right:4px}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>🔒 Astra 收盘观察</h1>
  <p class="sub">数据加密存储 · 输入口令解密查看</p>
  <div class="row">
    <input id="pwd" type="password" placeholder="访问口令" autocomplete="current-password">
    <button onclick="open_()">解密</button>
  </div>
  <p id="err"></p>
</div>
<div id="app" style="display:none"></div>
<script src="auth.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
